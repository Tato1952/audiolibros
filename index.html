<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audiolibros">
<meta name="theme-color" content="#12100e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Mis Audiolibros</title>
<style>
/* ===================== COLORES Y BASE ===================== */
:root{
  --fondo:#12100e; --panel:#1d1916; --panel2:#29231f; --linea:#3a322c;
  --texto:#f5eee6; --suave:#a3968a; --acento:#eaa53e; --acento2:#b8661f; --peligro:#e05a4f; --verde:#4caf7a;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --fondo-img: linear-gradient(135deg,#8a4b1c,#2a1a0f);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
body.bloqueado{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.3}
input[type=text],input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--linea);
  background:var(--panel2);color:var(--texto);font-size:16px;-webkit-user-select:text;user-select:text;outline:none}
#app{max-width:980px;margin:0 auto}

/* ===================== CABECERA ===================== */
header{position:sticky;top:0;z-index:5;background:rgba(18,16,14,.88);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:flex;align-items:center;gap:12px}
header .titulos{flex:1;min-width:0}
header h1{font-family:var(--serif);font-size:32px;margin:0;font-weight:700;letter-spacing:-.4px}
#estadis{font-size:12px;color:var(--suave);margin-top:3px}
.btn-mas{width:46px;height:46px;border-radius:50%;border:0;background:var(--acento);color:#1a1209;flex:none;
  font-size:28px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgba(234,165,62,.35)}

/* ===================== CONTINUAR ESCUCHANDO ===================== */
#continuar{margin:6px 16px 22px;border-radius:22px;overflow:hidden;position:relative;cursor:pointer;
  box-shadow:0 16px 40px rgba(0,0,0,.5);display:none}
.hero-fondo{position:absolute;inset:-50px;background:var(--fondo-img) center/cover;
  filter:blur(34px) brightness(.5) saturate(1.3)}
.hero{position:relative;display:flex;gap:16px;padding:16px;align-items:center}
.hero .tapa{width:108px;height:108px;border-radius:12px;overflow:hidden;flex:none;box-shadow:0 10px 26px rgba(0,0,0,.55)}
.hero .tapa > *{width:100%;height:100%}
.hero .txt{flex:1;min-width:0}
.etq{font-size:11px;letter-spacing:1.3px;font-weight:800;color:var(--acento);text-transform:uppercase}
.hero .tit{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.15;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .aut{font-size:13px;color:rgba(255,255,255,.72);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#heroInfo{font-size:12px;color:rgba(255,255,255,.78);margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .barra{background:rgba(255,255,255,.2);margin-top:7px}
#heroPlay{width:58px;height:58px;border-radius:50%;background:var(--acento);color:#1a1209;flex:none;border:0;
  display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#heroPlay svg{width:28px;height:28px;fill:currentColor}

/* ===================== BUSCADOR Y FILTROS ===================== */
.herr{padding:0 16px;display:flex;flex-direction:column;gap:12px;margin-bottom:4px}
.caja-busca{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:0 12px}
.caja-busca svg{width:18px;height:18px;fill:var(--suave);flex:none}
.caja-busca input{border:0;background:none;padding:11px 0;border-radius:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--linea);background:var(--panel);border-radius:20px;padding:7px 15px;font-size:14px;white-space:nowrap;color:var(--suave)}
.chip.on{background:var(--texto);color:var(--fondo);border-color:var(--texto);font-weight:700}
.seccion{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--suave);margin:18px 16px 12px;font-weight:800}

/* ===================== BIBLIOTECA ===================== */
#biblioteca{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:22px 16px;padding:0 16px 24px}
.libro{position:relative;cursor:pointer;transition:transform .15s}
.libro:active{transform:scale(.96)}
.libro .tapa{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.libro .tapa > .portada{width:100%;height:100%}
.libro.actual .tapa::after{content:'';position:absolute;inset:0;border:3px solid var(--acento);border-radius:12px}
.libro .tit{font-weight:700;font-size:14px;line-height:1.25;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.libro .aut{font-size:12px;color:var(--suave);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra{height:4px;background:var(--panel2);border-radius:2px;margin-top:8px;overflow:hidden}
.barra>div{height:100%;background:var(--acento);border-radius:2px;transition:width .4s}
.pct{font-size:11px;color:var(--suave);margin-top:5px}
.insignia{position:absolute;left:8px;top:8px;background:var(--acento);color:#1a1209;font-size:10px;font-weight:800;
  padding:3px 7px;border-radius:6px;letter-spacing:.6px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.insignia.fin{background:var(--verde);color:#fff}
.libro .mas{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;
  background:rgba(0,0,0,.55);color:#fff;font-size:18px;line-height:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vacio{grid-column:1/-1;text-align:center;color:var(--suave);padding:60px 24px;line-height:1.6;font-size:16px}
.vacio .grande{font-size:64px;display:block;margin-bottom:10px}

/* portada sin imagen: parece la tapa de un libro */
.portada{object-fit:cover;display:block}
.placeholder{display:flex;flex-direction:column;justify-content:space-between;padding:12%;color:#fff5e6;
  background:linear-gradient(150deg,#d38a35,#9a4f1a 55%,#4a230c);position:relative}
.placeholder::before{content:'';position:absolute;left:7%;top:0;bottom:0;width:3px;background:rgba(0,0,0,.18)}
.placeholder .ph-tit{font-family:var(--serif);font-weight:700;font-size:clamp(13px,1.15em,22px);line-height:1.15;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.placeholder .ph-aut{font-size:.7em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.placeholder.ini{align-items:center;justify-content:center;padding:0;font-family:var(--serif);font-weight:700;font-size:18px}
.placeholder.ini::before{display:none}

/* ===================== MINI REPRODUCTOR ===================== */
#mini{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:620px;
  background:rgba(41,35,31,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:16px;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:6;overflow:hidden;
  transform:translate(-50%,160%);transition:transform .3s}
#mini.visible{transform:translate(-50%,0)}
#miniImg{width:48px;height:48px;border-radius:9px;overflow:hidden;flex:none}
#miniImg > *{width:48px;height:48px}
#miniTxt{flex:1;min-width:0}
#miniTit{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniCap{font-size:12px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniBarra{position:absolute;left:0;bottom:0;height:3px;background:var(--acento);width:0}
.btn-icono{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;padding:0}
.btn-icono svg{width:28px;height:28px;fill:currentColor}

/* ===================== REPRODUCTOR GRANDE ===================== */
#reproductor{position:fixed;inset:0;z-index:10;background:var(--fondo);
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
#reproductor.abierto{transform:none}
#reproductor::before{content:'';position:fixed;inset:-80px;background:var(--fondo-img) center/cover;
  filter:blur(45px) brightness(.45) saturate(1.4);transition:background .5s}
#reproductor::after{content:'';position:fixed;inset:0;
  background:linear-gradient(180deg,rgba(18,16,14,.15) 0%,rgba(18,16,14,.55) 55%,rgba(18,16,14,.92) 100%)}
.rep-contenido{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 26px calc(env(safe-area-inset-bottom) + 20px)}
.rep-arriba{display:flex;align-items:center;justify-content:space-between;height:48px}
.rep-arriba button{border:0;background:rgba(255,255,255,.12);border-radius:20px;padding:8px 14px;font-size:15px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#btnCerrarRep{width:44px;height:36px;padding:0;display:grid;place-items:center}
#btnCerrarRep svg{width:22px;height:22px;fill:currentColor}
#repPortada{width:min(80vw,340px,40vh);aspect-ratio:1;margin:18px auto 26px;border-radius:16px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.7);flex:none;transition:transform .35s}
#repPortada.pausado{transform:scale(.9)}
#repPortada > *{width:100%;height:100%}
#repPortada .placeholder{font-size:26px}
#repTitulo{font-family:var(--serif);font-size:25px;font-weight:700;text-align:center;line-height:1.2}
#repAutor{font-size:16px;color:var(--acento);text-align:center;margin-top:5px}
#repCap{font-size:14px;color:rgba(255,255,255,.65);text-align:center;margin-top:8px;min-height:18px}

#slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;margin:28px 0 9px;outline:none;
  background:linear-gradient(90deg,var(--acento) var(--p,0%),rgba(255,255,255,.18) var(--p,0%))}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.tiempos{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums}
#repTotal{text-align:center;font-size:12px;color:rgba(255,255,255,.6);margin-top:8px}

.controles{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
.controles .btn-icono svg{width:30px;height:30px}
.salto{position:relative;width:60px;height:60px}
.salto svg{width:46px!important;height:46px!important}
.salto span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;padding-top:3px}
#btnPlay{width:84px;height:84px;border-radius:50%;background:var(--acento);color:#1a1209;box-shadow:0 10px 30px rgba(234,165,62,.45)}
#btnPlay svg{width:40px;height:40px}
.extras{display:flex;justify-content:center;gap:12px;margin-top:auto;padding-top:20px}
.extras button{border:0;background:rgba(255,255,255,.12);border-radius:22px;padding:10px 16px;font-size:15px;min-width:96px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.extras button.activo{background:var(--acento);color:#1a1209;font-weight:700}

/* ===================== HOJAS (ventanas que suben) ===================== */
.hoja{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s}
.hoja.abierta{opacity:1;pointer-events:auto}
#hojaCaratula{z-index:25}
.hoja .panel{width:100%;max-width:620px;max-height:90vh;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .3s}
.hoja.abierta .panel{transform:none}
.asa{width:40px;height:5px;border-radius:3px;background:var(--linea);margin:0 auto 14px}
.hoja h2{margin:0 0 16px;font-size:21px;font-family:var(--serif)}
.campo{margin-bottom:14px}
.campo > label{display:block;font-size:13px;color:var(--suave);margin-bottom:6px}
.btn-ancho{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;
  background:var(--panel2);margin-top:10px;text-align:center}
.btn-ancho.prin{background:var(--acento);color:#1a1209}
.btn-ancho.peligro{color:var(--peligro)}
.elegir{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--linea);
  border-radius:12px;padding:14px;color:var(--acento);font-weight:600;text-align:center;cursor:pointer;background:none;font-size:15px}
.elegir input{display:none}
#listaNuevos{font-size:12px;color:var(--suave);margin-top:8px;line-height:1.4;max-height:90px;overflow-y:auto}
.prev-portada{display:flex;gap:12px;align-items:stretch}
.prev-portada .caja{width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--panel2);flex:none;
  display:grid;place-items:center;color:var(--suave);font-size:30px}
.prev-portada .caja img{width:100%;height:100%;object-fit:cover}
.prev-portada .botones{flex:1;display:flex;flex-direction:column;gap:8px}
.prev-portada .elegir{flex:1;padding:8px}
.opcion{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;
  padding:14px 4px;border-bottom:1px solid var(--linea);font-size:16px;text-align:left;gap:10px}
.opcion small{color:var(--suave);font-variant-numeric:tabular-nums;flex:none}
.opcion.actual{color:var(--acento);font-weight:700}
.opcion .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* buscador de carátulas */
.busca-fila{display:flex;gap:8px}
.btn-buscar{border:0;border-radius:12px;background:var(--acento);color:#1a1209;font-weight:700;padding:0 16px;flex:none}
#estadoCaratula{font-size:13px;color:var(--suave);margin:12px 0;min-height:18px}
#gridCaratulas{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.res-car{border:0;background:var(--panel2);border-radius:10px;padding:0;overflow:hidden;position:relative}
.res-car img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.res-car span{position:absolute;left:4px;bottom:4px;font-size:9px;background:rgba(0,0,0,.7);color:#fff;padding:2px 5px;border-radius:4px}

/* ===================== AVISOS ===================== */
#cargando{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.75);display:none;place-items:center;padding:30px}
#cargando .caja{background:var(--panel);border-radius:18px;padding:26px;text-align:center;max-width:320px;width:100%}
#cargandoTxt{white-space:pre-line;font-size:14px;color:var(--suave);margin-top:14px;word-break:break-word}
.rueda{width:40px;height:40px;border-radius:50%;border:4px solid var(--linea);border-top-color:var(--acento);
  margin:0 auto;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#aviso{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-300%);z-index:50;
  background:var(--texto);color:var(--fondo);padding:10px 18px;border-radius:22px;font-size:14px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .3s,visibility .3s;max-width:90vw;text-align:center;visibility:hidden}
#aviso.visible{transform:translate(-50%,0);visibility:visible}
</style>
</head>
<body>
<div id="app">
  <!-- ===================== CABECERA ===================== -->
  <header>
    <div class="titulos">
      <h1>Mis Audiolibros</h1>
      <div id="estadis"></div>
    </div>
    <button class="btn-mas" id="btnNuevo" aria-label="Añadir audiolibro">+</button>
  </header>

  <!-- ===================== CONTINUAR ESCUCHANDO ===================== -->
  <section id="continuar">
    <div class="hero-fondo" id="heroFondo"></div>
    <div class="hero">
      <div class="tapa" id="heroTapa"></div>
      <div class="txt">
        <div class="etq">Continuar escuchando</div>
        <div class="tit" id="heroTit"></div>
        <div class="aut" id="heroAut"></div>
        <div id="heroInfo"></div>
        <div class="barra"><div id="heroBarra"></div></div>
      </div>
      <button id="heroPlay" aria-label="Reproducir"></button>
    </div>
  </section>

  <!-- ===================== BUSCADOR Y FILTROS ===================== -->
  <div class="herr" id="herr">
    <div class="caja-busca">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <input type="search" id="buscar" placeholder="Buscar por título o autor">
    </div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="todos">Todos</button>
      <button class="chip" data-f="curso">Escuchando</button>
      <button class="chip" data-f="nuevos">Sin empezar</button>
      <button class="chip" data-f="fin">Terminados</button>
    </div>
  </div>
  <div class="seccion" id="tituloSeccion">Mi biblioteca</div>
  <main id="biblioteca"></main>
</div>

<!-- Mini reproductor -->
<div id="mini">
  <div id="miniImg"></div>
  <div id="miniTxt"><div id="miniTit"></div><div id="miniCap"></div></div>
  <button class="btn-icono" id="miniPlay" aria-label="Reproducir"></button>
  <div id="miniBarra"></div>
</div>

<!-- ===================== REPRODUCTOR ===================== -->
<section id="reproductor">
  <div class="rep-contenido">
    <div class="rep-arriba">
      <button id="btnCerrarRep" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
      <button id="btnCapitulos">☰ Capítulos</button>
    </div>
    <div id="repPortada" class="pausado"></div>
    <div id="repTitulo"></div>
    <div id="repAutor"></div>
    <div id="repCap"></div>

    <input type="range" id="slider" min="0" max="1" step="1" value="0">
    <div class="tiempos"><span id="tAct">0:00</span><span id="tRest">-0:00</span></div>
    <div id="repTotal"></div>

    <div class="controles">
      <button class="btn-icono" id="btnAnt" aria-label="Capítulo anterior">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="btn-icono salto" id="btnAtras" aria-label="Atrás 15 segundos">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span>15</span></button>
      <button class="btn-icono" id="btnPlay" aria-label="Reproducir"></button>
      <button class="btn-icono salto" id="btnAdelante" aria-label="Adelante 30 segundos">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg><span>30</span></button>
      <button class="btn-icono" id="btnSig" aria-label="Capítulo siguiente">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>

    <div class="extras">
      <button id="btnVel">1×</button>
      <button id="btnDormir">🌙 Dormir</button>
    </div>
  </div>
</section>

<!-- ===================== HOJA: AÑADIR LIBRO ===================== -->
<div class="hoja" id="hojaNuevo"><div class="panel">
  <div class="asa"></div>
  <h2>Añadir audiolibro</h2>
  <div class="campo">
    <label class="elegir">🎧 Elegir archivos de audio
      <input type="file" id="inArchivos" multiple accept="audio/*,.mp3,.m4a,.m4b,.aac,.wav,.ogg,.flac">
    </label>
    <div id="listaNuevos"></div>
  </div>
  <div class="campo"><label>Título</label><input type="text" id="inTitulo" placeholder="Título del libro"></div>

<script>
'use strict';
/* =====================================================================
   1. UTILIDADES PEQUEÑAS
   ===================================================================== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}
function fmtLargo(s) {
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}
function fmtMB(b) { return b > 1e9 ? (b / 1e9).toFixed(1).replace('.', ',') + ' GB' : Math.round(b / 1e6) + ' MB'; }
function nombreLimpio(n) { return n.replace(/\.[^.]+$/, '').replace(/_+/g, ' ').trim(); }
function iniciales(t) { return (t || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(''); }
function sinAcentos(t) { return (t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function tipoAudio(f) {
  if (f.type) return f.type;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  return { mp3: 'audio/mpeg', m4a: 'audio/mp4', m4b: 'audio/mp4', aac: 'audio/aac',
           wav: 'audio/wav', ogg: 'audio/ogg', flac: 'audio/flac' }[ext] || 'audio/mpeg';
}
let tAviso;
function aviso(txt) {
  const a = $('#aviso'); a.textContent = txt; a.classList.add('visible');
  clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('visible'), 2600);
}

/* =====================================================================
   2. BASE DE DATOS (IndexedDB, dentro del propio iPhone)
   ===================================================================== */
let db;
function abrirDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('audiolibros', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('libros'))   d.createObjectStore('libros',   { keyPath: 'id' });
      if (!d.objectStoreNames.contains('archivos')) d.createObjectStore('archivos', { keyPath: 'id' });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}
function operacion(almacen, modo, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(almacen, modo);
    const req = fn(t.objectStore(almacen));
    let resultado;
    if (req) req.onsuccess = () => { resultado = req.result; };
    t.oncomplete = () => res(resultado);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const dbGet   = (a, id)  => operacion(a, 'readonly',  s => s.get(id));
const dbTodos = a        => operacion(a, 'readonly',  s => s.getAll());
const dbPut   = (a, obj) => operacion(a, 'readwrite', s => s.put(obj));
const dbDel   = (a, id)  => operacion(a, 'readwrite', s => s.delete(id));

/* =====================================================================
   3. LEER ETIQUETAS DE LOS ARCHIVOS (título, autor y carátula incrustada)
      - MP3: etiquetas ID3
      - M4B / M4A (lo normal en audiolibros): "átomos" MP4
   ===================================================================== */
function syncsafe(b, i) { return (b[i] & 0x7f) << 21 | (b[i+1] & 0x7f) << 14 | (b[i+2] & 0x7f) << 7 | (b[i+3] & 0x7f); }
function textoID3(d) {
  const cod = ['iso-8859-1', 'utf-16', 'utf-16be', 'utf-8'][d[0]] || 'iso-8859-1';
  try { return new TextDecoder(cod).decode(d.subarray(1)).replace(/\u0000/g, '').trim(); } catch (e) { return ''; }
}
function imagenID3(d) {
  const enc = d[0];
  let i = 1;
  while (i < d.length && d[i] !== 0) i++;
  let mime = new TextDecoder('iso-8859-1').decode(d.subarray(1, i)) || 'image/jpeg';
  if (!mime.includes('/')) mime = 'image/' + mime.toLowerCase();
  i += 2;
  if (enc === 1 || enc === 2) { while (i + 1 < d.length && !(d[i] === 0 && d[i+1] === 0)) i += 2; i += 2; }
  else { while (i < d.length && d[i] !== 0) i++; i++; }
  return new Blob([d.slice(i)], { type: mime });
}
async function leerID3(file) {
  try {
    const cab = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (cab[0] !== 0x49 || cab[1] !== 0x44 || cab[2] !== 0x33) return {};
    const ver = cab[3];
    if (ver < 3) return {};
    const b = new Uint8Array(await file.slice(10, 10 + syncsafe(cab, 6)).arrayBuffer());
    let p = 0;
    if (cab[5] & 0x40) p = ver === 4 ? syncsafe(b, 0) : ((b[0] << 24 | b[1] << 16 | b[2] << 8 | b[3]) >>> 0) + 4;
    const out = {};
    while (p + 10 <= b.length) {
      const id = String.fromCharCode(b[p], b[p+1], b[p+2], b[p+3]);
      if (!/^[A-Z0-9]{4}$/.test(id)) break;
      const t = ver === 4 ? syncsafe(b, p + 4) : ((b[p+4] << 24 | b[p+5] << 16 | b[p+6] << 8 | b[p+7]) >>> 0);
      const datos = b.subarray(p + 10, p + 10 + t);
      if (id === 'TIT2' || id === 'TPE1' || id === 'TALB') out[id] = textoID3(datos);
      if (id === 'APIC' && !out.APIC) out.APIC = imagenID3(datos);
      p += 10 + t;
    }
    return out;
  } catch (e) { return {}; }
}

// Recorre las "cajas" de un archivo MP4: [tamaño 4 bytes][tipo 4 letras][contenido]
function leerCajas(buf, ini, fin) {
  const v = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const out = [];
  let p = ini;
  while (p + 8 <= fin) {
    let tam = v.getUint32(p), cab = 8;
    const tipo = String.fromCharCode(buf[p+4], buf[p+5], buf[p+6], buf[p+7]);
    if (tam === 1) { tam = Number(v.getBigUint64(p + 8)); cab = 16; }
    else if (tam === 0) tam = fin - p;
    if (tam < cab || p + tam > fin) break;
    out.push({ tipo, ini: p + cab, fin: p + tam });
    p += tam;
  }
  return out;
}
async function leerMP4(file) {
  try {
    const ftyp = new Uint8Array(await file.slice(4, 8).arrayBuffer());
    if (String.fromCharCode(...ftyp) !== 'ftyp') return {};
    // Busca la caja "moov" (donde están las etiquetas), que puede estar al principio o al final
    let p = 0, moov = null;
    const n = file.size;
    while (p + 8 <= n) {
      const b = new Uint8Array(await file.slice(p, p + 16).arrayBuffer());
      const v = new DataView(b.buffer);
      let tam = v.getUint32(0), cab = 8;
      const tipo = String.fromCharCode(b[4], b[5], b[6], b[7]);
      if (tam === 1) { tam = Number(v.getBigUint64(8)); cab = 16; }
      else if (tam === 0) tam = n - p;
      if (tam < cab) break;
      if (tipo === 'moov') { if (tam > 80e6) return {}; moov = new Uint8Array(await file.slice(p, p + tam).arrayBuffer()); break; }
      p += tam;
    }
    if (!moov) return {};
    const raiz = leerCajas(moov, 0, moov.length)[0];
    const hijo = (c, t) => c && leerCajas(moov, c.ini, c.fin).find(x => x.tipo === t);
    const meta = hijo(hijo(raiz, 'udta'), 'meta') || hijo(raiz, 'meta');
    if (!meta) return {};
    const ilst = leerCajas(moov, meta.ini + 4, meta.fin).find(x => x.tipo === 'ilst');
    if (!ilst) return {};
    const out = {}, dec = new TextDecoder('utf-8');
    for (const it of leerCajas(moov, ilst.ini, ilst.fin)) {
      const data = leerCajas(moov, it.ini, it.fin).find(x => x.tipo === 'data');
      if (!data) continue;
      const clase = moov[data.ini + 3];
      const valor = moov.subarray(data.ini + 8, data.fin);
      if (it.tipo === '©nam') out.TIT2 = dec.decode(valor).trim();
      else if (it.tipo === '©alb') out.TALB = dec.decode(valor).trim();
      else if (it.tipo === '©ART') out.TPE1 = dec.decode(valor).trim();
      else if (it.tipo === 'aART' && !out.TPE1) out.TPE1 = dec.decode(valor).trim();
      else if (it.tipo === 'covr' && !out.APIC) out.APIC = new Blob([valor.slice()], { type: clase === 14 ? 'image/png' : 'image/jpeg' });
    }
    return out;
  } catch (e) { return {}; }
}
async function leerEtiquetas(file) {
  const id3 = await leerID3(file);
  return Object.keys(id3).length ? id3 : await leerMP4(file);
}

function getDuracion(blob) {
  return new Promise(res => {
    const a = new Audio(), url = URL.createObjectURL(blob);
    let hecho = false;
    const fin = d => { if (hecho) return; hecho = true; URL.revokeObjectURL(url); a.removeAttribute('src'); res(isFinite(d) && d > 0 ? d : 0); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => fin(a.duration);
    a.onerror = () => fin(0);
    setTimeout(() => fin(a.duration), 8000);
    a.src = url;
  });
}

function reducirImagen(blob, max = 600) {
  return new Promise(res => {
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      try { c.toBlob(b => res(b || blob), 'image/jpeg', 0.86); } catch (e) { res(blob); }
    };
    im.onerror = () => { URL.revokeObjectURL(u); res(blob); };
    im.src = u;
  });
}

/* =====================================================================
   4. BUSCAR CARÁTULAS EN INTERNET
      Fuentes gratuitas: Apple Books (audiolibros y libros), Google Books y Open Library
   ===================================================================== */
function fetchTiempo(url, ms = 9000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, { signal: ctl.signal }).finally(() => clearTimeout(t));
}
const fetchJSON = (url, ms) => fetchTiempo(url, ms).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

// Apple se consulta con "JSONP": se carga la respuesta como si fuera un script
function jsonp(url, ms = 9000) {
  return new Promise((res, rej) => {
    const cb = 'cbItunes' + uid();
    const s = document.createElement('script');
    const limpiar = () => { clearTimeout(t); window[cb] = () => {}; s.remove(); };
    const t = setTimeout(() => { limpiar(); rej(new Error('tiempo')); }, ms);
    window[cb] = d => { limpiar(); res(d); };
    s.onerror = () => { limpiar(); rej(new Error('jsonp')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}

function limpiarTitulo(t) {
  return (t || '')
    .replace(/[\(\[].*?[\)\]]/g, ' ')
    .replace(/audio\s*libros?|completo|versi[oó]n\s+\w+|narrado\s+por.*$|le[ií]do\s+por.*$|cap[ií]tulo\s*\d+|parte\s*\d+/gi, ' ')
    .replace(/^\d+[\s._-]+/, '')
    .replace(/[_]+/g, ' ').replace(/\s+-\s*$/, '')
    .replace(/\s+/g, ' ').trim();
}

async function buscarCaratulas(consulta) {
  const q = encodeURIComponent(consulta);
  const apple = (media, campo) =>
    jsonp(`https://itunes.apple.com/search?term=${q}&media=${media}&limit=10&country=es`)
      .then(d => (d.results || []).filter(r => r.artworkUrl100).map(r => ({
        url: r.artworkUrl100.replace(/\/\d+x\d+(bb)?\./, '/600x600bb.'),
        titulo: r[campo] || r.trackName || '', fuente: 'Apple' })));
  const listas = await Promise.allSettled([
    apple('audiobook', 'collectionName'),
    fetchJSON(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=12&printType=books`)
      .then(d => (d.items || []).filter(i => i.volumeInfo && i.volumeInfo.imageLinks).map(i => ({
        url: (i.volumeInfo.imageLinks.thumbnail || i.volumeInfo.imageLinks.smallThumbnail)
               .replace('http://', 'https://').replace('&edge=curl', ''),
        titulo: i.volumeInfo.title || '', fuente: 'Google' }))),
    fetchJSON(`https://openlibrary.org/search.json?q=${q}&limit=12&fields=cover_i,title`)
      .then(d => (d.docs || []).filter(x => x.cover_i).map(x => ({
        url: `https://covers.openlibrary.org/b/id/${x.cover_i}-L.jpg`, titulo: x.title || '', fuente: 'Open Library' }))),
    apple('ebook', 'trackName')
  ]);
  // Mezcla los resultados de todas las fuentes, sin repetir
  const res = listas.map(r => r.status === 'fulfilled' ? r.value : []);
  const todos = [], vistos = new Set();
  for (let i = 0; i < 12; i++)
    for (const l of res)
      if (l[i] && !vistos.has(l[i].url)) { vistos.add(l[i].url); todos.push(l[i]); }
  return todos;
}

function probarImagen(url) {
  return new Promise(res => {
    const im = new Image();
    const t = setTimeout(() => res(false), 9000);
    im.onload = () => { clearTimeout(t); res(im.naturalWidth > 10); };
    im.onerror = () => { clearTimeout(t); res(false); };
    im.src = url;
  });
}
// Intenta guardar la imagen dentro de la app; si el servidor no deja, guarda su dirección
async function descargarImagen(url) {
  try {
    const r = await fetchTiempo(url, 10000);
    if (!r.ok) throw 0;
    const b = await r.blob();
    if (!b.type.startsWith('image/') || b.size < 1500) throw 0;
    return { blob: await reducirImagen(b), reducida: true };
  } catch (e) {
    return (await probarImagen(url)) ? { url } : {};
  }
}

async function aplicarCaratula(l, d) {
  if (!d || (!d.blob && !d.url)) return false;
  if (d.blob) { l.portada = d.reducida ? d.blob : await reducirImagen(d.blob); l.portadaUrl = null; }
  else { l.portada = null; l.portadaUrl = d.url; }
  olvidarPortada(l.id);
  return true;
}

// Busca sola la carátula de un libro y se queda con la primera que funcione
async function caratulaAutomatica(l) {
  l.caratulaBuscada = true;
  try {
    const t = limpiarTitulo(l.titulo);
    const a = /audio\s*libro/i.test(l.autor || '') ? '' : (l.autor || '');
    let res = a ? await buscarCaratulas(t + ' ' + a) : [];
    if (!res.length) res = await buscarCaratulas(t);
    for (const r of res.slice(0, 4)) {
      if (await aplicarCaratula(l, await descargarImagen(r.url))) break;
    }
  } catch (e) {}
  await dbPut('libros', l).catch(() => {});
  return !!(l.portada || l.portadaUrl);
}

// Al abrir la app, busca carátula a los libros que no tengan
async function completarCaratulas() {
  if (!navigator.onLine) return;
  for (const l of libros.filter(x => !x.portada && !x.portadaUrl && !x.caratulaBuscada)) {
    if (await caratulaAutomatica(l)) {
      pintarBiblioteca(); pintarContinuar();
      if (libro && libro.id === l.id) { pintarReproductor(); ponerMetadatos(); }
    }
  }
}

// ---- Ventana para elegir carátula a mano ----
let alElegirCaratula = null;
function abrirBuscadorCaratula(consulta, cb) {
  alElegirCaratula = cb;
  $('#qCaratula').value = limpiarTitulo(consulta);
  abrirHoja('#hojaCaratula');
  lanzarBusqueda();
}
async function lanzarBusqueda() {
  const q = $('#qCaratula').value.trim();
  const g = $('#gridCaratulas'); g.innerHTML = '';
  if (!q) { $('#estadoCaratula').textContent = 'Escribe el título del libro.'; return; }
  if (!navigator.onLine) { $('#estadoCaratula').textContent = 'No hay conexión a internet.'; return; }
  $('#estadoCaratula').textContent = 'Buscando…';
  const res = await buscarCaratulas(q);
  if (q !== $('#qCaratula').value.trim()) return;
  $('#estadoCaratula').textContent = res.length
    ? `${res.length} resultados · toca la que quieras`
    : 'No se ha encontrado nada. Prueba solo con el título, o con título y autor.';
  for (const r of res) {
    const b = document.createElement('button'); b.className = 'res-car'; b.title = r.titulo;
    const im = document.createElement('img'); im.loading = 'lazy'; im.src = r.url; im.alt = r.titulo;
    im.onerror = () => b.remove();
    const f = document.createElement('span'); f.textContent = r.fuente;
    b.append(im, f);
    b.onclick = async () => {
      cerrarHoja('#hojaCaratula');
      mostrarCargando('Descargando carátula…');
      const d = await descargarImagen(r.url);
      ocultarCargando();
      if (!d.blob && !d.url) { aviso('No se pudo descargar esa imagen'); return; }
      if (alElegirCaratula) alElegirCaratula(d);
    };
    g.appendChild(b);
  }
}
$('#btnQCaratula').onclick = lanzarBusqueda;
$('#qCaratula').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lanzarBusqueda(); } });

/* =====================================================================
   5. PORTADAS Y PROGRESO
   ===================================================================== */
const urlsPortada = new Map();
function urlPortada(l) {
  if (l.portada) {
    let u = urlsPortada.get(l.id);
    if (!u) { u = URL.createObjectURL(l.portada); urlsPortada.set(l.id, u); }
    return u;
  }
  return l.portadaUrl || null;
}
function olvidarPortada(id) {
  const u = urlsPortada.get(id);
  if (u) { URL.revokeObjectURL(u); urlsPortada.delete(id); }
}
// pequeña = true → solo iniciales (para el mini reproductor)
function elPortada(l, pequena) {
  const u = urlPortada(l);
  if (u) {
    const i = document.createElement('img'); i.src = u; i.alt = ''; i.className = 'portada';
    i.onerror = () => i.replaceWith(phPortada(l, pequena));
    return i;
  }
  return phPortada(l, pequena);
}
function phPortada(l, pequena) {
  const d = document.createElement('div');
  d.className = 'portada placeholder' + (pequena ? ' ini' : '');
  if (pequena) { d.textContent = iniciales(l.titulo); return d; }
  const t = document.createElement('div'); t.className = 'ph-tit'; t.textContent = l.titulo;
  const a = document.createElement('div'); a.className = 'ph-aut'; a.textContent = l.autor || '';
  d.append(t, a);
  return d;
}
function fondoDe(l) { const u = l && urlPortada(l); return u ? `url("${u}")` : 'linear-gradient(135deg,#8a4b1c,#2a1a0f)'; }

function totalLibro(l) { return l.capitulos.reduce((a, c) => a + (c.duracion || 0), 0); }
function escuchado(l, pos) {
  let s = 0;
  for (let i = 0; i < l.cap; i++) s += l.capitulos[i].duracion || 0;
  return s + (pos != null ? pos : (l.pos || 0));
}
function porcentaje(l, pos) {
  if (l.terminado) return 100;
  const t = totalLibro(l);
  return t ? Math.min(100, Math.round(escuchado(l, pos) / t * 100)) : 0;
}
function estado(l) {
  if (l.terminado) return 'fin';
  const pos = (libro && libro.id === l.id) ? posicionActual() : null;
  return escuchado(l, pos) > 5 ? 'curso' : 'nuevos';
}

/* =====================================================================
   6. BIBLIOTECA
   ===================================================================== */
let libros = [];
let filtro = 'todos';
function leerLocal(id) { try { return JSON.parse(localStorage.getItem('pos_' + id)); } catch (e) { return null; } }

async function cargarBiblioteca() {
  libros = await dbTodos('libros');
  for (const l of libros) {
    const g = leerLocal(l.id);
    if (g && g.t > (l.actualizado || 0) && g.cap < l.capitulos.length) { l.cap = g.cap; l.pos = g.pos; l.actualizado = g.t; }
  }
  if (libro) { const i = libros.findIndex(x => x.id === libro.id); if (i >= 0) libros[i] = libro; }
  libros.sort((a, b) => (b.actualizado || 0) - (a.actualizado || 0));
  pintarBiblioteca();
  pintarContinuar();
  pintarMini();
  mostrarEstadis();
}

function pintarBiblioteca() {
  const cont = $('#biblioteca');
  cont.innerHTML = '';
  $('#herr').style.display = libros.length > 1 ? '' : 'none';
  if (!libros.length) {
    $('#tituloSeccion').style.display = 'none';
    cont.innerHTML = '<div class="vacio"><span class="grande">🎧</span>Tu biblioteca está vacía.<br>Pulsa <b>+</b> para añadir tu primer audiolibro.</div>';
    return;
  }
  $('#tituloSeccion').style.display = '';
  const q = sinAcentos($('#buscar').value.trim());
  const lista = libros.filter(l =>
    (filtro === 'todos' || estado(l) === filtro) &&
    (!q || sinAcentos(l.titulo + ' ' + (l.autor || '')).includes(q)));
  $('#tituloSeccion').textContent = { todos: 'Mi biblioteca', curso: 'Escuchando', nuevos: 'Sin empezar', fin: 'Terminados' }[filtro]
    + ` · ${lista.length}`;
  if (!lista.length) { cont.innerHTML = '<div class="vacio">No hay libros que coincidan.</div>'; return; }

  for (const l of lista) {
    const card = document.createElement('div');
    card.className = 'libro' + (libro && libro.id === l.id ? ' actual' : '');
    const tapa = document.createElement('div'); tapa.className = 'tapa';
    tapa.appendChild(elPortada(l));
    const est = estado(l);
    if (est !== 'curso') {
      const ins = document.createElement('div');
      ins.className = 'insignia' + (est === 'fin' ? ' fin' : '');
      ins.textContent = est === 'fin' ? '✓ TERMINADO' : 'NUEVO';
      tapa.appendChild(ins);
    }
    const mas = document.createElement('button'); mas.className = 'mas'; mas.textContent = '⋯'; mas.setAttribute('aria-label', 'Opciones');
    mas.onclick = e => { e.stopPropagation(); abrirEditar(l.id); };
    tapa.appendChild(mas);

    const t = document.createElement('div'); t.className = 'tit'; t.textContent = l.titulo;
    const a = document.createElement('div'); a.className = 'aut'; a.textContent = l.autor || 'Autor desconocido';
    card.append(tapa, t, a);
    const pos = (libro && libro.id === l.id) ? posicionActual() : null;
    const p = porcentaje(l, pos);
    const pc = document.createElement('div'); pc.className = 'pct';
    if (est === 'curso') {
      const b = document.createElement('div'); b.className = 'barra';
      const bi = document.createElement('div'); bi.style.width = p + '%'; b.appendChild(bi);
      card.appendChild(b);
      pc.textContent = `${p} % · quedan ${fmtLargo(totalLibro(l) - escuchado(l, pos))}`;
    } else pc.textContent = fmtLargo(totalLibro(l)) + (l.capitulos.length > 1 ? ` · ${l.capitulos.length} partes` : '');
    card.appendChild(pc);
    card.onclick = () => abrirLibro(l.id, true);
    cont.appendChild(card);
  }
}

function mostrarEstadis() {
  const horas = libros.reduce((s, l) => s + totalLibro(l), 0);
  const base = libros.length ? `${libros.length} libro${libros.length === 1 ? '' : 's'} · ${fmtLargo(horas)} de audio` : 'Tu biblioteca de audiolibros';
  $('#estadis').textContent = base;
  if (libros.length && navigator.storage && navigator.storage.estimate)
    navigator.storage.estimate().then(e => { $('#estadis').textContent = base + ' · ' + fmtMB(e.usage || 0); }).catch(() => {});
}

$('#buscar').addEventListener('input', pintarBiblioteca);
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  filtro = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  pintarBiblioteca();
});

function pintarContinuar() {

   7. AÑADIR UN LIBRO NUEVO
   ===================================================================== */
let nuevosArchivos = [], nuevaPortada = null;   // nuevaPortada = {blob} o {url}

function mostrarPrev(caja, p) {
  const c = $(caja); c.innerHTML = '';
  const src = p instanceof Blob ? URL.createObjectURL(p) : (p && p.blob ? URL.createObjectURL(p.blob) : (p && p.url) || p);
  if (src) { const i = document.createElement('img'); i.src = src; c.appendChild(i); }
  else c.textContent = '📖';
}
function limpiarNuevo() {
  nuevosArchivos = []; nuevaPortada = null;
  $('#inArchivos').value = ''; $('#inPortada').value = '';
  $('#inTitulo').value = ''; $('#inAutor').value = '';
  $('#listaNuevos').textContent = ''; mostrarPrev('#prevNueva', null);
}

$('#btnNuevo').onclick = () => { limpiarNuevo(); abrirHoja('#hojaNuevo'); };

$('#inArchivos').onchange = async e => {
  nuevosArchivos = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true }));
  $('#listaNuevos').textContent = nuevosArchivos.length
    ? `${nuevosArchivos.length} archivo(s): ` + nuevosArchivos.map(f => f.name).join(' · ') : '';
  if (!nuevosArchivos.length) return;
  const tags = await leerEtiquetas(nuevosArchivos[0]);
  if (!$('#inTitulo').value)
    $('#inTitulo').value = tags.TALB || (nuevosArchivos.length === 1 && tags.TIT2) || nombreLimpio(nuevosArchivos[0].name);
  if (!$('#inAutor').value && tags.TPE1) $('#inAutor').value = tags.TPE1;

};
$('#inPortada').onchange = e => {
  const f = e.target.files[0];
  if (f) { nuevaPortada = { blob: f }; mostrarPrev('#prevNueva', nuevaPortada); }
};
$('#btnBuscarNueva').onclick = () => {
  const t = $('#inTitulo').value.trim() || (nuevosArchivos[0] && nombreLimpio(nuevosArchivos[0].name)) || '';
  const a = $('#inAutor').value.trim();
  abrirBuscadorCaratula(a && !/audio\s*libro/i.test(a) ? t + ' ' + a : t, d => { nuevaPortada = d; mostrarPrev('#prevNueva', d); });
};

$('#btnGuardarNuevo').onclick = async () => {
  if (!nuevosArchivos.length) { alert('Elige al menos un archivo de audio.'); return; }
  const titulo = $('#inTitulo').value.trim() || nombreLimpio(nuevosArchivos[0].name);
  const autor = $('#inAutor').value.trim();
  const archivos = nuevosArchivos, portada = nuevaPortada;
  cerrarHoja('#hojaNuevo');
  mostrarCargando('Preparando…');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const guardados = [];
  let nuevo = null;
  try {
    const ahora = Date.now();
    nuevo = { id: uid(), titulo, autor, portada: null, portadaUrl: null,
              capitulos: [], cap: 0, pos: 0, velocidad: 1, creado: ahora, actualizado: ahora, terminado: false };
    if (portada) await aplicarCaratula(nuevo, portada);
    for (let i = 0; i < archivos.length; i++) {
      const f = archivos[i];
      mostrarCargando(`Guardando ${i + 1} de ${archivos.length}…\n${f.name}`);
      const archivoId = uid();
      await dbPut('archivos', { id: archivoId, blob: new Blob([f], { type: tipoAudio(f) }) });
      guardados.push(archivoId);
      const tags = archivos.length > 1 ? await leerEtiquetas(f) : {};
      const duracion = await getDuracion(f);
      nuevo.capitulos.push({ nombre: tags.TIT2 || nombreLimpio(f.name), archivoId, duracion });
    }
    await dbPut('libros', nuevo);
  } catch (err) {
    for (const id of guardados) await dbDel('archivos', id).catch(() => {});
    nuevo = null;
    alert('No se pudo guardar el libro.\n' + (err && err.message || err) + '\n\nPuede que no quede espacio libre en el iPhone.');
  }
  if (nuevo && !nuevo.portada && !nuevo.portadaUrl && navigator.onLine) {
    mostrarCargando('Buscando la carátula en internet…');
    await caratulaAutomatica(nuevo);
  }
  ocultarCargando();
  limpiarNuevo();
  await cargarBiblioteca();
  if (nuevo) aviso(`«${nuevo.titulo}» añadido a la biblioteca`);
};

    cerrarReproductor();
  }
  for (const c of l.capitulos) await dbDel('archivos', c.archivoId).catch(() => {});
  await dbDel('libros', l.id);
  try { localStorage.removeItem('pos_' + l.id); } catch (e) {}
  olvidarPortada(l.id);
  cerrarHoja('#hojaEditar');
  cargarBiblioteca();
};

/* =====================================================================
   9. REPRODUCTOR Y GUARDADO DEL PUNTO EXACTO
   ===================================================================== */
const audio = $('#audio');
let libro = null;
let urlAudio = null;
let posPendiente = null;
let objetivo = null;
let arrastrando = false;
let ultimoGuardado = 0;
let finTemporizador = 0, temporizadorCap = false;

const ICO_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICO_PAUSA = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function duracionCap() {
  if (isFinite(audio.duration) && audio.duration > 0) return audio.duration;
  return libro ? (libro.capitulos[libro.cap].duracion || 0) : 0;
}
function posicionActual() {
  if (posPendiente != null) return posPendiente;
  if (objetivo != null) return objetivo;
  return audio.currentTime || 0;
}

function guardarPos(forzar) {
  if (!libro) return;
  const ahora = Date.now();
  if (!forzar && ahora - ultimoGuardado < 2000) return;
  ultimoGuardado = ahora;
  libro.pos = posicionActual();
  libro.actualizado = ahora;
  try {
    localStorage.setItem('pos_' + libro.id, JSON.stringify({ cap: libro.cap, pos: libro.pos, t: ahora }));
    localStorage.setItem('ultimoLibro', libro.id);
  } catch (e) {}
  dbPut('libros', libro).catch(() => {});
}

async function abrirLibro(id, mostrar) {
  if (!libro || libro.id !== id) {
    if (libro) { guardarPos(true); audio.pause(); }
    const l = libros.find(x => x.id === id) || await dbGet('libros', id);
    if (!l) return;
    libro = l;
    if (libro.cap >= libro.capitulos.length) { libro.cap = 0; libro.pos = 0; }
    quitarTemporizador();
    await cargarCapitulo(libro.cap, libro.pos || 0, false);
    pintarBiblioteca();
    pintarContinuar();
  }
  if (mostrar) abrirReproductor();
}

async function cargarCapitulo(i, pos, reproducir) {
  const c = libro.capitulos[i];
  const reg = await dbGet('archivos', c.archivoId);
  if (!reg) { alert('No encuentro el archivo de este capítulo.'); return; }
  if (urlAudio) URL.revokeObjectURL(urlAudio);
  urlAudio = URL.createObjectURL(reg.blob);
  libro.cap = i; libro.pos = pos;
  posPendiente = pos > 0 ? pos : null;
  objetivo = null;
  audio.src = urlAudio;
  audio.load();
  audio.playbackRate = libro.velocidad || 1;
  pintarReproductor();
  ponerMetadatos();
  if (reproducir) { try { await audio.play(); } catch (e) {} }
  guardarPos(true);
}

function aplicarPendiente() {
  if (posPendiente == null || audio.readyState < 1) return;
  const d = audio.duration;
  const t = isFinite(d) ? Math.min(posPendiente, Math.max(0, d - 0.5)) : posPendiente;
  posPendiente = null;
  objetivo = t;
  try { audio.currentTime = t; } catch (e) { posPendiente = t; objetivo = null; }
}

function saltarA(t) {
  if (!libro) return;
  const d = duracionCap();
  t = Math.max(0, d ? Math.min(t, d - 0.5) : t);
  objetivo = null;
  if (audio.readyState < 1) posPendiente = t;
  else { posPendiente = null; audio.currentTime = t; }
  libro.pos = t;
  if (libro.terminado) libro.terminado = false;
  pintarTiempo();
  guardarPos(true);
}

async function alternar() {
  if (!libro) return;
  if (audio.paused) {
    if (libro.terminado) { libro.terminado = false; await cargarCapitulo(0, 0, true); return; }
    try { await audio.play(); } catch (e) {}
  } else audio.pause();
}

async function irCapitulo(i, reproducir) {
  if (!libro || i < 0 || i >= libro.capitulos.length) return;
  guardarPos(true);
  libro.terminado = false;
  await cargarCapitulo(i, 0, reproducir);
}

audio.addEventListener('loadedmetadata', () => {
  aplicarPendiente();
  if (libro) {
    audio.playbackRate = libro.velocidad || 1;
    const c = libro.capitulos[libro.cap];
    if (isFinite(audio.duration) && Math.abs((c.duracion || 0) - audio.duration) > 1) {
      c.duracion = audio.duration;
      guardarPos(true);
    }
  }
  pintarTiempo();
});
audio.addEventListener('playing', () => {
  aplicarPendiente();
  if (objetivo != null) {
    if (Math.abs(audio.currentTime - objetivo) > 2) audio.currentTime = objetivo;
    objetivo = null;
  }
  if (libro) audio.playbackRate = libro.velocidad || 1;
  pintarBotonPlay();
});
audio.addEventListener('seeked', () => {
  if (objetivo != null && Math.abs(audio.currentTime - objetivo) < 2) objetivo = null;
  guardarPos(true);
});
audio.addEventListener('timeupdate', () => {
  if (!libro) return;
  if (!arrastrando) pintarTiempo();
  guardarPos(false);
  actualizarPosicionMS();
  comprobarTemporizador();
});
audio.addEventListener('play',  pintarBotonPlay);
audio.addEventListener('pause', () => { guardarPos(true); pintarBotonPlay(); });
audio.addEventListener('ended', async () => {
  if (!libro) return;
  const sig = libro.cap + 1;
  if (sig < libro.capitulos.length) {
    const seguir = !temporizadorCap;
    if (temporizadorCap) quitarTemporizador();
    await cargarCapitulo(sig, 0, seguir);
  } else {
    libro.terminado = true;
    guardarPos(true);
    pintarReproductor();
    pintarBiblioteca();
  }
});

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') guardarPos(true); });
window.addEventListener('pagehide', () => guardarPos(true));
window.addEventListener('beforeunload', () => guardarPos(true));

/* =====================================================================
   10. PINTAR EL REPRODUCTOR
   ===================================================================== */
function pintarReproductor() {
  if (!libro) return;
  $('#reproductor').style.setProperty('--fondo-img', fondoDe(libro));
  const cont = $('#repPortada'); cont.innerHTML = '';
  cont.appendChild(elPortada(libro));
  $('#repTitulo').textContent = libro.titulo;
  $('#repAutor').textContent = libro.autor || '';
  const c = libro.capitulos[libro.cap];
  $('#repCap').textContent = libro.terminado ? '¡Libro terminado! Pulsa ▶ para volver a empezar'
    : (libro.capitulos.length > 1 ? `Parte ${libro.cap + 1} de ${libro.capitulos.length} · ${c.nombre}` : c.nombre);
  $('#btnVel').textContent = velTexto(libro.velocidad || 1);
  $('#btnAnt').disabled = libro.cap === 0;
  $('#btnSig').disabled = libro.cap >= libro.capitulos.length - 1;
  pintarTiempo();
  pintarBotonPlay();
  pintarMini();
}
function pintarTiempo() {
  if (!libro) return;
  const d = duracionCap(), p = Math.min(posicionActual(), d || Infinity);
  const s = $('#slider');
  s.max = Math.max(1, Math.floor(d));
  if (!arrastrando) s.value = Math.floor(p);
  s.style.setProperty('--p', (d ? p / d * 100 : 0) + '%');
  $('#tAct').textContent = fmt(p);
  $('#tRest').textContent = '-' + fmt(Math.max(0, d - p));
  const total = totalLibro(libro), pc = porcentaje(libro, p);
  const queda = fmtLargo(total - escuchado(libro, p));
  $('#repTotal').textContent = total ? `Quedan ${queda} del libro · ${pc} %` : '';
  $('#miniBarra').style.width = pc + '%';
  $('#heroBarra').style.width = pc + '%';
  const parte = libro.capitulos.length > 1 ? `Parte ${libro.cap + 1} de ${libro.capitulos.length} · ` : '';
  $('#heroInfo').textContent = libro.terminado ? 'Terminado ✓' : `${parte}quedan ${queda}`;
  $('#miniCap').textContent = libro.capitulos.length > 1 ? `Parte ${libro.cap + 1} · ${fmt(p)}` : fmt(p);
}
function pintarBotonPlay() {
  const ico = audio.paused ? ICO_PLAY : ICO_PAUSA;
  $('#btnPlay').innerHTML = ico;
  $('#miniPlay').innerHTML = ico;
  $('#heroPlay').innerHTML = ico;
  $('#repPortada').classList.toggle('pausado', audio.paused);
}
let heroVisible = false;
function pintarMini() {
  const m = $('#mini');
  const abierto = $('#reproductor').classList.contains('abierto');
  m.classList.toggle('visible', !!libro && !heroVisible && !abierto);
  if (!libro) return;
  const img = $('#miniImg'); img.innerHTML = ''; img.appendChild(elPortada(libro, true));
  $('#miniTit').textContent = libro.titulo;
}
// El mini reproductor solo aparece cuando la tarjeta "Continuar" no se ve
if ('IntersectionObserver' in window)
  new IntersectionObserver(e => { heroVisible = e[0].isIntersecting; pintarMini(); }).observe($('#continuar'));

function abrirReproductor() {
  pintarReproductor();
  $('#reproductor').classList.add('abierto');
  document.body.classList.add('bloqueado');
  pintarMini();
}
function cerrarReproductor() {
  $('#reproductor').classList.remove('abierto');
  document.body.classList.remove('bloqueado');
  pintarBiblioteca(); pintarContinuar(); pintarMini();
}

$('#btnPlay').onclick = alternar;
$('#miniPlay').onclick = e => { e.stopPropagation(); alternar(); };
$('#mini').onclick = () => abrirReproductor();
$('#btnCerrarRep').onclick = cerrarReproductor;
$('#btnAtras').onclick = () => saltarA(posicionActual() - 15);
$('#btnAdelante').onclick = () => saltarA(posicionActual() + 30);
$('#btnAnt').onclick = () => irCapitulo(libro.cap - 1, !audio.paused);
$('#btnSig').onclick = () => irCapitulo(libro.cap + 1, !audio.paused);

const slider = $('#slider');
slider.addEventListener('input', () => {
  arrastrando = true;
  const d = duracionCap();
  $('#tAct').textContent = fmt(+slider.value);
  $('#tRest').textContent = '-' + fmt(d - slider.value);
  slider.style.setProperty('--p', (d ? slider.value / d * 100 : 0) + '%');
});
slider.addEventListener('change', () => { arrastrando = false; saltarA(+slider.value); });

const VELOCIDADES = [0.75, 1, 1.25, 1.5, 1.75, 2];
const velTexto = v => String(v).replace('.', ',') + '×';
$('#btnVel').onclick = () => {
  if (!libro) return;
  const i = VELOCIDADES.indexOf(libro.velocidad || 1);
  libro.velocidad = VELOCIDADES[(i + 1) % VELOCIDADES.length];
  audio.playbackRate = libro.velocidad;
  $('#btnVel').textContent = velTexto(libro.velocidad);
  guardarPos(true);
};

$('#btnCapitulos').onclick = () => {
  const cont = $('#listaCapitulos'); cont.innerHTML = '';
  libro.capitulos.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'opcion' + (i === libro.cap ? ' actual' : '');
    const n = document.createElement('span'); n.className = 'nom'; n.textContent = `${i + 1}. ${c.nombre}`;
    const d = document.createElement('small'); d.textContent = c.duracion ? fmt(c.duracion) : '';
    b.append(n, d);
    b.onclick = () => { cerrarHoja('#hojaCapitulos'); if (i !== libro.cap) irCapitulo(i, true); };
    cont.appendChild(b);
  });
  abrirHoja('#hojaCapitulos');
  const act = cont.querySelector('.actual'); if (act) act.scrollIntoView({ block: 'center' });
};

$('#btnDormir').onclick = () => abrirHoja('#hojaDormir');
document.querySelectorAll('#hojaDormir .opcion').forEach(b => b.onclick = () => {
  const v = b.dataset.min;
  quitarTemporizador();
  if (v === 'cap') temporizadorCap = true;
  else if (+v > 0) finTemporizador = Date.now() + v * 60000;
  pintarTemporizador();
  cerrarHoja('#hojaDormir');
});
function quitarTemporizador() { finTemporizador = 0; temporizadorCap = false; pintarTemporizador(); }
function comprobarTemporizador() {
  if (finTemporizador && Date.now() >= finTemporizador) { audio.pause(); quitarTemporizador(); }
  else if (finTemporizador) pintarTemporizador();
}
function pintarTemporizador() {
  const b = $('#btnDormir');
  if (temporizadorCap) { b.textContent = '🌙 Fin de parte'; b.classList.add('activo'); }
  else if (finTemporizador) { b.textContent = '🌙 ' + Math.ceil((finTemporizador - Date.now()) / 60000) + ' min'; b.classList.add('activo'); }
  else { b.textContent = '🌙 Dormir'; b.classList.remove('activo'); }
}

/* =====================================================================
   11. PANTALLA DE BLOQUEO Y CENTRO DE CONTROL
   ===================================================================== */
function ponerMetadatos() {
  if (!('mediaSession' in navigator) || !libro) return;
  const c = libro.capitulos[libro.cap], art = urlPortada(libro);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: libro.capitulos.length > 1 ? c.nombre : libro.titulo,
      artist: libro.autor || '',
      album: libro.titulo,
      artwork: art ? [{ src: art, sizes: '600x600', type: 'image/jpeg' }]
                   : [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
    });
  } catch (e) {}
}
function actualizarPosicionMS() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  try {
    const d = duracionCap();
    if (d) navigator.mediaSession.setPositionState({ duration: d, playbackRate: audio.playbackRate || 1, position: Math.min(audio.currentTime, d) });
  } catch (e) {}
}
if ('mediaSession' in navigator) {
  const h = (accion, fn) => { try { navigator.mediaSession.setActionHandler(accion, fn); } catch (e) {} };
  h('play',  () => audio.play());
  h('pause', () => audio.pause());
  h('seekbackward', d => saltarA(posicionActual() - ((d && d.seekOffset) || 15)));
  h('seekforward',  d => saltarA(posicionActual() + ((d && d.seekOffset) || 30)));
  h('seekto', d => { if (d && d.seekTime != null) saltarA(d.seekTime); });
}

/* =====================================================================
   12. HOJAS Y AVISOS
   ===================================================================== */
function abrirHoja(sel) { $(sel).classList.add('abierta'); }
function cerrarHoja(sel) { $(sel).classList.remove('abierta'); }
document.querySelectorAll('.hoja').forEach(h => h.addEventListener('click', e => { if (e.target === h) h.classList.remove('abierta'); }));
document.querySelectorAll('[data-cerrar]').forEach(b => b.onclick = () => cerrarHoja(b.dataset.cerrar));
function mostrarCargando(txt) { $('#cargandoTxt').textContent = txt; $('#cargando').style.display = 'grid'; }
function ocultarCargando() { $('#cargando').style.display = 'none'; }

/* =====================================================================
   13. ARRANQUE
   ===================================================================== */
(async function arrancar() {
  pintarBotonPlay();
  try {
    await abrirDB();
    await cargarBiblioteca();
    const ultimo = localStorage.getItem('ultimoLibro');
    if (ultimo && libros.some(l => l.id === ultimo)) await abrirLibro(ultimo, false);
  } catch (e) {
    $('#biblioteca').innerHTML = '<div class="vacio">No se pudo abrir la base de datos.<br>' + (e && e.message || e) + '</div>';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  completarCaratulas();
})();
</script>
